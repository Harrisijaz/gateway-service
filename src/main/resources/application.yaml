spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:localhostredispassword}

server:
  port: ${GATEWAY_PORT:9094}
  max-http-request-header-size: 16KB

gateway:
  checkout-success-redirect-url: ${CHECKOUT_SUCCESS_REDIRECT_URL:http://localhost:3000/billing/success}
  allowed-origins:
    - ${FRONTEND_ORIGIN:http://localhost:3000}
    - ${FRONTEND_ORIGIN_VITE:http://localhost:5173}
    - ${FRONTEND_ORIGIN_ALT:http://localhost:3001}
  jwt:
    jwks-url: ${GATEWAY_JWKS_URL:http://localhost:9090/auth/.well-known/jwks.json}
    issuer: ${AUTH_ISSUER:smart-invoice-auth}
    jwks-ttl: ${GATEWAY_JWKS_TTL:1h}
    stale-key-grace: ${GATEWAY_JWKS_STALE_GRACE:4h}
    clock-skew: ${GATEWAY_JWT_CLOCK_SKEW:30s}
    token-encryption-enabled: ${AUTH_TOKEN_ENCRYPTION_ENABLED:false}
    jwe-secret: ${AUTH_JWE_SECRET:}
  rate-limit:
    global-limit: ${GATEWAY_GLOBAL_RATE_LIMIT:1000}
    global-window: ${GATEWAY_GLOBAL_RATE_WINDOW:1m}
    overrides:
      - path: /auth/signup
        limit: ${GATEWAY_SIGNUP_RATE_LIMIT:50}
        window: ${GATEWAY_SIGNUP_RATE_WINDOW:1m}
      - path: /auth/login
        limit: ${GATEWAY_LOGIN_RATE_LIMIT:100}
        window: ${GATEWAY_LOGIN_RATE_WINDOW:1m}
      - path: /user/auth/login
        limit: ${GATEWAY_LOGIN_RATE_LIMIT:100}
        window: ${GATEWAY_LOGIN_RATE_WINDOW:1m}
      - path: /user/auth/signup
        limit: ${GATEWAY_SIGNUP_RATE_LIMIT:50}
        window: ${GATEWAY_SIGNUP_RATE_WINDOW:1m}
      - path: /admin/auth/login
        limit: ${GATEWAY_ADMIN_LOGIN_RATE_LIMIT:1000}
        window: ${GATEWAY_ADMIN_LOGIN_RATE_WINDOW:1m}
      - path: /auth/forgot-password
        limit: ${GATEWAY_PASSWORD_RESET_RATE_LIMIT:3}
        window: ${GATEWAY_PASSWORD_RESET_RATE_WINDOW:1h}
      - path: /auth/reset-password
        limit: ${GATEWAY_PASSWORD_RESET_RATE_LIMIT:3}
        window: ${GATEWAY_PASSWORD_RESET_RATE_WINDOW:1h}
      - path: /user/auth/forgot-password
        limit: ${GATEWAY_PASSWORD_RESET_RATE_LIMIT:3}
        window: ${GATEWAY_PASSWORD_RESET_RATE_WINDOW:1h}
  resilience:
    default-timeout: ${GATEWAY_DEFAULT_TIMEOUT:5s}
    minimum-calls: ${GATEWAY_CIRCUIT_MIN_CALLS:10}
    failure-rate-threshold-percent: ${GATEWAY_CIRCUIT_FAILURE_RATE:50}
    open-state-cooldown: ${GATEWAY_CIRCUIT_COOLDOWN:30s}
    half-open-trial-calls: ${GATEWAY_CIRCUIT_HALF_OPEN_TRIALS:3}
  routes:
    - id: auth-signup
      service-id: auth-service
      path: /auth/signup
      uri: ${AUTH_SERVICE_URL:http://localhost:9090}
      rewrite-to: /user/auth/signup
      auth-required: false
    - id: auth-login
      service-id: auth-service
      path: /auth/login
      uri: ${AUTH_SERVICE_URL:http://localhost:9090}
      rewrite-to: /user/auth/login
      auth-required: false
    - id: auth-verify-email
      service-id: auth-service
      path: /auth/verify-email
      uri: ${AUTH_SERVICE_URL:http://localhost:9090}
      rewrite-to: /user/auth/verify-email
      auth-required: false
    - id: auth-resend-verification
      service-id: auth-service
      path: /auth/resend-verification
      uri: ${AUTH_SERVICE_URL:http://localhost:9090}
      rewrite-to: /user/auth/resend-verification
      auth-required: false
    - id: auth-verify-2fa
      service-id: auth-service
      path: /auth/verify-2fa
      uri: ${AUTH_SERVICE_URL:http://localhost:9090}
      rewrite-to: /user/auth/verify-2fa
      auth-required: false
    - id: auth-refresh
      service-id: auth-service
      path: /auth/refresh
      uri: ${AUTH_SERVICE_URL:http://localhost:9090}
      auth-required: false
    - id: auth-logout
      service-id: auth-service
      path: /auth/logout
      uri: ${AUTH_SERVICE_URL:http://localhost:9090}
      auth-required: true
      roles: [USER, ADMIN]
    - id: auth-logout-all
      service-id: auth-service
      path: /auth/logout-all
      uri: ${AUTH_SERVICE_URL:http://localhost:9090}
      auth-required: true
      roles: [USER, ADMIN]
    - id: auth-forgot-password
      service-id: auth-service
      path: /auth/forgot-password
      uri: ${AUTH_SERVICE_URL:http://localhost:9090}
      auth-required: false
    - id: auth-reset-password
      service-id: auth-service
      path: /auth/reset-password
      uri: ${AUTH_SERVICE_URL:http://localhost:9090}
      auth-required: false
    - id: contact-us
      service-id: auth-service
      path: /contact-us
      uri: ${AUTH_SERVICE_URL:http://localhost:9090}
      auth-required: false
    - id: auth-change-password
      service-id: auth-service
      path: /auth/change-password
      uri: ${AUTH_SERVICE_URL:http://localhost:9090}
      auth-required: true
      roles: [USER, ADMIN]
    - id: profile
      service-id: auth-service
      path: /profile/**
      uri: ${AUTH_SERVICE_URL:http://localhost:9090}
      auth-required: true
      roles: [USER, ADMIN]
    - id: auth-jwks
      service-id: auth-service
      path: /auth/.well-known/jwks.json
      uri: ${AUTH_SERVICE_URL:http://localhost:9090}
      auth-required: false
    - id: auth-internal-admin
      service-id: auth-service
      path: /internal/admin/**
      uri: ${AUTH_SERVICE_URL:http://localhost:9090}
      auth-required: true
      roles: [ADMIN]
    - id: user-auth-signup
      service-id: auth-service
      path: /user/auth/signup
      uri: ${AUTH_SERVICE_URL:http://localhost:9090}
      auth-required: false
    - id: user-auth-login
      service-id: auth-service
      path: /user/auth/login
      uri: ${AUTH_SERVICE_URL:http://localhost:9090}
      auth-required: false
    - id: user-auth-verify-email
      service-id: auth-service
      path: /user/auth/verify-email
      uri: ${AUTH_SERVICE_URL:http://localhost:9090}
      auth-required: false
    - id: user-auth-resend-verification
      service-id: auth-service
      path: /user/auth/resend-verification
      uri: ${AUTH_SERVICE_URL:http://localhost:9090}
      auth-required: false
    - id: user-auth-verify-2fa
      service-id: auth-service
      path: /user/auth/verify-2fa
      uri: ${AUTH_SERVICE_URL:http://localhost:9090}
      auth-required: false
    - id: admin-auth-login
      service-id: auth-service
      path: /admin/auth/login
      uri: ${AUTH_SERVICE_URL:http://localhost:9090}
      auth-required: false
    - id: admin-service
      service-id: admin-service
      path: /admin/**
      uri: ${ADMIN_SERVICE_URL:http://localhost:9091}
      auth-required: true
      roles: [ADMIN]
    - id: invoices
      service-id: user-service
      path: /invoices/**
      uri: ${USER_SERVICE_URL:http://localhost:9092}
      auth-required: true
      roles: [USER]
    - id: quotations
      service-id: user-service
      path: /quotations/**
      uri: ${USER_SERVICE_URL:http://localhost:9092}
      auth-required: true
      roles: [USER]
    - id: expenses
      service-id: user-service
      path: /expenses/**
      uri: ${USER_SERVICE_URL:http://localhost:9092}
      auth-required: true
      roles: [USER]
    - id: finance
      service-id: user-service
      path: /finance/**
      uri: ${USER_SERVICE_URL:http://localhost:9092}
      auth-required: true
      roles: [USER]
    - id: subscription
      service-id: user-service
      path: /subscription/**
      uri: ${USER_SERVICE_URL:http://localhost:9092}
      auth-required: true
      roles: [USER]
    - id: settings
      service-id: user-service
      path: /settings
      uri: ${USER_SERVICE_URL:http://localhost:9092}
      auth-required: true
      roles: [USER]
    - id: payment-webhook
      service-id: user-service
      path: /webhooks/payment-gateway
      uri: ${USER_SERVICE_URL:http://localhost:9092}
      auth-required: false
    - id: ai-generate-invoice
      service-id: user-service
      path: /ai/generate-invoice
      uri: ${USER_SERVICE_URL:http://localhost:9092}
      auth-required: true
      roles: [USER]
